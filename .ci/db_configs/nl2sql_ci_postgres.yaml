# Cloud SQL Postgres CI instance, shared with the verify-harnesses check.
# The dataset's "database" field (db_blog) replaces database_name.
db_type: postgres
dialect: postgres
database_name: db_blog
database_path: !ENV ${EVAL_GCP_PROJECT_ID}:${CLOUD_SQL_POSTGRES_REGION}:${CLOUD_SQL_POSTGRES_INSTANCE}
max_executions_per_minute: 180
user_name: !ENV ${CLOUD_SQL_POSTGRES_USER}
password: !ENV ${CLOUD_SQL_POSTGRES_PASSWORD}
