steps:
  - id: pull-cache
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache || exit 0']

  - id: build-image
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['pull-cache']
    args: ['build',
           '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache',
           '-t', 'evalbench-harness-ci',
           '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache',
           '-f', 'evalbench_service/Dockerfile', '.']

  # Pushed here rather than via top-level `images:`, which only runs when the
  # whole build succeeds -- a failing build would never warm the cache.
  - id: push-cache
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-image']
    allowFailure: true
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache']

  # agy authenticates as the build service account via the metadata server.
  - id: agy-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=agy_cli uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/run_config.yaml']
    env: &harness_env
      - 'EVAL_GCP_PROJECT_ID=${_EVAL_PROJECT}'
      - 'EVAL_GCP_PROJECT_REGION=global'
      - 'CI_CSQL_INSTANCE=${_CI_CSQL_INSTANCE}'
      - 'UV_CACHE_DIR=/tmp/uv-cache'
    volumes: &results_volume
      - name: 'eval_results'
        path: '/evalbench/results'

  - id: claude-code
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=claude_code uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/run_config.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: codex-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=codex_cli uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/run_config.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: agy-cli-skills
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=agy_cli uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/skills_run_config.yaml']
    env: &skills_env
      - 'EVAL_GCP_PROJECT_ID=${_EVAL_PROJECT}'
      - 'EVAL_GCP_PROJECT_REGION=global'
      - 'UV_CACHE_DIR=/tmp/uv-cache'
      - 'CLOUD_SQL_POSTGRES_REGION=${_CLOUD_SQL_POSTGRES_REGION}'
      - 'CLOUD_SQL_POSTGRES_INSTANCE=${_CLOUD_SQL_POSTGRES_INSTANCE}'
      - 'CLOUD_SQL_POSTGRES_DATABASE=${_CLOUD_SQL_POSTGRES_DATABASE}'
      - 'CLOUD_SQL_POSTGRES_USER=${_CLOUD_SQL_POSTGRES_USER}'
      - 'CLOUD_SQL_POSTGRES_IP_TYPE=${_CLOUD_SQL_POSTGRES_IP_TYPE}'
    secretEnv: &skills_secrets ['CLOUD_SQL_POSTGRES_PASSWORD']
    volumes: *results_volume

  - id: claude-code-skills
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=claude_code uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/skills_run_config.yaml']
    env: *skills_env
    secretEnv: *skills_secrets
    volumes: *results_volume

  - id: codex-cli-skills
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    entrypoint: 'bash'
    args: ['-c', 'CI_HARNESS=codex_cli uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/skills_run_config.yaml']
    env: *skills_env
    secretEnv: *skills_secrets
    volumes: *results_volume

  # Both channels run in one step so a failure in either still reports the
  # other.
  - id: verify
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['agy-cli', 'claude-code', 'codex-cli',
              'agy-cli-skills', 'claude-code-skills', 'codex-cli-skills']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        rc=0
        uv run --no-sync python3 .ci/verify_harness.py \
          --harnesses agy_cli claude_code codex_cli || rc=1
        uv run --no-sync python3 .ci/verify_harness.py \
          --run-config .ci/skills_run_config.yaml \
          --evalset .ci/harness_skills.evalset.json \
          --harnesses agy_cli claude_code codex_cli || rc=1
        exit $$rc
    volumes: *results_volume

availableSecrets:
  secretManager:
    - versionName: projects/${_EVAL_PROJECT}/secrets/ci-smoke-postgres-password/versions/latest
      env: 'CLOUD_SQL_POSTGRES_PASSWORD'

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
  # Sized for the six concurrent harness steps, not for the build.
  machineType: 'E2_HIGHCPU_8'