# _EVAL_PROJECT and _CI_CSQL_INSTANCE are left undefined so the target project
# and instance stay out of this public repo; the trigger supplies both.

steps:
  # Primes the layer cache. The pull fails on the first build, before the tag exists.
  - id: pull-cache
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache || exit 0']

  - id: build-image
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['pull-cache']
    args: ['build',
           '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache',
           '-t', 'evalbench-harness-ci',
           '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache',
           '-f', 'evalbench_service/Dockerfile', '.']

  # allowFailure on all four: verify-harnesses is the gate, so one broken
  # harness must not cancel the others before they report.
  - id: agy-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/agy_cli.yaml']
    env: &harness_env
      - 'EVAL_GCP_PROJECT_ID=${_EVAL_PROJECT}'
      - 'EVAL_GCP_PROJECT_REGION=global'
      - 'CI_CSQL_INSTANCE=${_CI_CSQL_INSTANCE}'
      - 'UV_CACHE_DIR=/tmp/uv-cache'
    volumes: &results_volume
      - name: 'eval_results'
        path: '/evalbench/results'

  - id: claude-code
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/claude_code.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: codex-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/codex_cli.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: gemini-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/gemini_cli.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: verify-harnesses
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['agy-cli', 'claude-code', 'codex-cli', 'gemini-cli']
    args: ['uv', 'run', '--no-sync', 'python3', '.ci/verify_harness.py']
    volumes: *results_volume

timeout: '3600s'

# Republished every build so the next one starts warm.
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache'

options:
  logging: CLOUD_LOGGING_ONLY
  # Sized for the four concurrent harness steps, not for the build.
  machineType: 'E2_HIGHCPU_8'
