steps:
  - id: build-image
    name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'evalbench-harness-ci', '-f', 'evalbench_service/Dockerfile', '.']

  # The four harness steps share a waitFor, so Cloud Build runs them
  # concurrently. allowFailure keeps a single broken harness from cancelling
  # the others -- verify-harnesses is the gate, so one run reports on all four.
  - id: agy-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/agy_cli.yaml']
    env: &harness_env
      - 'EVAL_GCP_PROJECT_ID=${_EVAL_PROJECT}'
      - 'EVAL_GCP_PROJECT_REGION=us-central1'
      - 'CI_CSQL_INSTANCE=${_CI_CSQL_INSTANCE}'
      - 'UV_CACHE_DIR=/tmp/uv-cache'
    volumes: &results_volume
      - name: 'eval_results'
        path: '/evalbench/results'

  - id: claude-code
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/claude_code.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: codex-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/codex_cli.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: gemini-cli
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['build-image']
    allowFailure: true
    args: ['uv', 'run', '--no-sync', 'evalbench/evalbench.py',
           '--experiment_config=.ci/run_configs/gemini_cli.yaml']
    env: *harness_env
    volumes: *results_volume

  - id: verify-harnesses
    name: 'evalbench-harness-ci'
    dir: '/evalbench'
    waitFor: ['agy-cli', 'claude-code', 'codex-cli', 'gemini-cli']
    args: ['uv', 'run', '--no-sync', 'python3', '.ci/verify_harness.py']
    volumes: *results_volume

# _EVAL_PROJECT and _CI_CSQL_INSTANCE are deliberately left undefined so the
# target project and instance stay out of this public repo. The trigger
# supplies both; a build that omits either fails validation before any step
# runs.

timeout: '3600s'

options:
  logging: CLOUD_LOGGING_ONLY
