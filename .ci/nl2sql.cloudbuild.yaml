# verify-nl2sql: NL2SQL presubmit check (trigger in evalbench-testing).
# Builds the image locally (no Artifact Registry push), runs the QueryData
# smoke eval (.ci/nl2sql_run_config.yaml) and grades it with
# .ci/verify_nl2sql.py.
#
# Trigger substitutions: _EVAL_PROJECT, _CLOUD_SQL_POSTGRES_REGION,
# _CLOUD_SQL_POSTGRES_INSTANCE, _CLOUD_SQL_POSTGRES_USER.
# Prerequisite: db_blog is seeded (.ci/nl2sql_seed_config.yaml).
steps:
  # Fails fast if a substitution or the secret is empty.
  - id: preflight
    name: 'bash'
    entrypoint: 'bash'
    waitFor: ['-']
    args:
      - '-c'
      - |
        rc=0
        for var in EVAL_GCP_PROJECT_ID CLOUD_SQL_POSTGRES_REGION \
                   CLOUD_SQL_POSTGRES_INSTANCE CLOUD_SQL_POSTGRES_USER \
                   CLOUD_SQL_POSTGRES_PASSWORD; do
          if [ -z "$${!var}" ]; then
            echo "[FAIL] $$var is empty. Set the trigger substitution or secret." >&2
            rc=1
          fi
        done
        exit $$rc
    env: &eval_env
      - 'EVAL_GCP_PROJECT_ID=${_EVAL_PROJECT}'
      - 'EVAL_GCP_PROJECT_REGION=global'
      - 'UV_CACHE_DIR=/tmp/uv-cache'
      - 'CLOUD_SQL_POSTGRES_REGION=${_CLOUD_SQL_POSTGRES_REGION}'
      - 'CLOUD_SQL_POSTGRES_INSTANCE=${_CLOUD_SQL_POSTGRES_INSTANCE}'
      - 'CLOUD_SQL_POSTGRES_USER=${_CLOUD_SQL_POSTGRES_USER}'
    secretEnv: &eval_secrets ['CLOUD_SQL_POSTGRES_PASSWORD']

  # Read-only reuse of the verify-harnesses layer cache.
  - id: pull-cache
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    waitFor: ['-']
    args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache || exit 0']

  - id: build-image
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['pull-cache']
    args: ['build',
           '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/evalbench/evalbench-harness-ci:cache',
           '-t', 'evalbench-nl2sql-ci',
           '-f', 'evalbench_service/Dockerfile', '.']

  # Exits 0 when the run completes. The verify step decides pass or fail.
  - id: nl2sql-eval
    name: 'evalbench-nl2sql-ci'
    dir: '/evalbench'
    waitFor: ['preflight', 'build-image']
    entrypoint: 'bash'
    args: ['-c', 'uv run --no-sync evalbench/evalbench.py --experiment_config=.ci/nl2sql_run_config.yaml']
    env: *eval_env
    secretEnv: *eval_secrets
    volumes: &results_volume
      - name: 'eval_results'
        path: '/evalbench/results'

  - id: verify
    name: 'evalbench-nl2sql-ci'
    dir: '/evalbench'
    waitFor: ['nl2sql-eval']
    entrypoint: 'bash'
    args: ['-c', 'uv run --no-sync python3 .ci/verify_nl2sql.py']
    volumes: *results_volume

availableSecrets:
  secretManager:
    - versionName: projects/${_EVAL_PROJECT}/secrets/ci-smoke-postgres-password/versions/latest
      env: 'CLOUD_SQL_POSTGRES_PASSWORD'

# A cold image build plus the eval can exceed the 10 minute default.
timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
  # Sized for the image build.
  machineType: 'E2_HIGHCPU_8'
