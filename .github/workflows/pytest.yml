name: run-pytest

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # The bastion runners are persistent VMs with access to the internal
    # network. Do not run the code of a pull request from a fork on them.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bastion]
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Generate Proto Files
      run: uv run make proto
    - name: Run tests
      run: |
        uv run --with pytest pytest evalbench/test -vv
      env:
        PYTHONPATH: ${{ github.workspace }}/evalbench:${{ github.workspace }}
