name: Release

on:
  release:
    types: [created]
  # Build the binaries on PRs that can break the build, so a failure shows
  # on the PR and not on release day. A PR run does not publish.
  pull_request:
    branches:
      - main
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - 'pyinstaller.spec'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for testing or asset re-upload (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-artifacts:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
            arch_name: x64
          - os: macos-latest
            platform_name: darwin
            arch_name: arm64
          - os: windows-latest
            platform_name: win32
            arch_name: x64

    env:
      # If no version is set, uv installs the newest CPython. Dependencies
      # can lack wheels for a new CPython release, and then the build fails.
      # All uv commands in this job read UV_PYTHON.
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # A manual run with tag_name builds the source at that tag, not
          # the source at the default branch.
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          # A cache from another workflow run could change the release
          # binaries, so the release build does not use a cache.
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.UV_PYTHON }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary with PyInstaller
        run: uv run pyinstaller pyinstaller.spec

      # A binary can build and still fail at startup, for example if a data
      # file is not bundled.
      - name: Smoke test the binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            BIN=dist/evalbench.exe
          else
            BIN=dist/evalbench
          fi
          # absl exits 1 after it prints --help, so the grep is the real check.
          HELP_OUTPUT=$("$BIN" --help 2>&1 || true)
          printf '%s\n' "$HELP_OUTPUT" | tail -n 20
          echo "$HELP_OUTPUT" | grep -q "experiment_config"

      - name: Prepare distribution
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/evalbench.exe staging/
          else
            mv dist/evalbench staging/
          fi
          cp README.md staging/
          cp LICENSE staging/

      - name: Archive artifacts (Unix)
        if: runner.os != 'Windows'
        working-directory: staging
        run: |
          tar -czf ../${{ matrix.platform_name }}.${{ matrix.arch_name }}.evalbench.tar.gz *

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        working-directory: staging
        run: |
          Compress-Archive -Path * -DestinationPath ../${{ matrix.platform_name }}.${{ matrix.arch_name }}.evalbench.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.platform_name }}-${{ matrix.arch_name }}
          path: |
            ${{ matrix.platform_name }}.${{ matrix.arch_name }}.evalbench.tar.gz
            ${{ matrix.platform_name }}.${{ matrix.arch_name }}.evalbench.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: build-artifacts
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Upload Release Assets
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: release-assets/*
