name: verify-viewer

on:
  pull_request:
    branches:
      - main
    paths:
      - 'viewer/**'
      # Dependency bumps land here only, and mesop is the likeliest way to break the UI.
      - 'uv.lock'
      - '.ci/verify_viewer.py'
      - '.ci/fixtures/viewer_results/**'
      - '.github/workflows/viewer.yml'

permissions: read-all

jobs:
  load-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # --all-packages because the viewer is a workspace member, not a root dependency.
    - name: Load the app and render every page
      run: uv run --all-packages python .ci/verify_viewer.py

    # Start the server with the gunicorn command that Cloud Run uses.
    # Mesop answers 200 for every URL, so this checks boot, not page content.
    - name: Boot the frontend server
      working-directory: viewer
      run: |
        PORT=3000 uv run --all-packages ./run_frontend.sh > /tmp/frontend.log 2>&1 &
        PID=$!
        for _ in $(seq 1 30); do
          if curl -fs -o /dev/null http://localhost:3000/; then
            echo "The server answered on port 3000."
            kill "$PID"
            exit 0
          fi
          # Stop waiting if the server exited early.
          kill -0 "$PID" 2>/dev/null || break
          sleep 2
        done
        echo "FAIL: the server did not answer on port 3000."
        cat /tmp/frontend.log
        kill "$PID" 2>/dev/null || true
        exit 1
