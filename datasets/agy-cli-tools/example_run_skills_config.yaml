############################################################
### Dataset / Eval Items
############################################################
dataset_config: datasets/agy-cli-tools/agy-cli-skills.evalset.json
dataset_format: agent-format

# Orchestrator Configuration
orchestrator: agent
model_config: datasets/model_configs/agy_cli_skills_model.yaml
simulated_user_model_config: datasets/model_configs/gemini_2.5_pro_model.yaml

############################################################
### Scorer Related Configs
############################################################
scorers:
  # trajectory_matcher and parameter_analysis are omitted: the agent activates
  # high-level skills rather than invoking granular tools directly.
  skills_trajectory:
    # Score recall only. A skill counts as activated once the agent reads its
    # SKILL.md, so an extra skill means the agent browsed it, not that it
    # answered wrongly.
    allow_extra_skills: true
  skills_best_practices:
    model_config: datasets/model_configs/gemini_2.5_pro_model.yaml
  goal_completion:
    model_config: datasets/model_configs/gemini_2.5_pro_model.yaml
  behavioral_metrics:
    model_config: datasets/model_configs/gemini_2.5_pro_model.yaml
  turn_count: {}
  end_to_end_latency: {}
  tool_call_latency: {}
  token_consumption: {}

############################################################
### Reporting Related Configs
############################################################
reporting:
  csv:
    output_directory: 'results'
