############################################################
### Dataset Quality — example run config
############################################################
# Grades the intrinsic quality of a CUJ dataset (no eval / agent run). Runs on the
# standard agent pipeline: a no-op generator does nothing, and the `dataset_quality`
# scorer grades the whole dataset holistically (each sub-scorer computes a 0-100
# sub-score; grading rolls them into a weighted global score + letter grade).
#
# One run grades one dataset. To grade several, list several run configs under a
# suite (see datasets/sample_suite_config.yaml).

orchestrator: agent

# Bundles every CUJ into one wrapper scenario so the scorer is invoked once with
# the full dataset (the default formats can't parse CUJ scenarios this way).
dataset_format: dataset-quality-format
dataset_config: datasets/gemini-cli-tools/gemini-cli.evalset.json

# No-op agent generator: satisfies AgentEvaluator's AgentCliGenerator requirement
# while producing no output (no CLI, no API call).
model_config: datasets/model_configs/noop_agent_model.yaml

# Never actually called (single-turn wrapper scenario); only needs to construct.
simulated_user_model_config: datasets/model_configs/noop_agent_model.yaml

############################################################
### Scorers
############################################################
# The `dataset_quality` scorer fetches the product's tool catalog live from its own
# model_config (every setup.mcp_servers entry with an httpUrl is queried via MCP
# tools/list; names are namespaced <server>__<tool> to match expected_trajectory).
# google_credentials servers use ADC, so this needs credentials + network (e.g.
# `gcloud auth application-default login`). Run the LLM judges with
# EVAL_GCP_PROJECT_REGION=global.
scorers:
  dataset_quality:
    product_name: "Gemini CLI Tools"
    model_config: datasets/model_configs/gemini_cli_model.yaml
    # tools_timeout: 30   # optional; live tools/list fetch timeout in seconds
    scorers:
      trajectory_coverage:
        weight: 5
      naming_distribution:
        weight: 5
      parameter_coverage:
        weight: 5
        min_items: 1
        model_config: datasets/model_configs/gemini_3.1_pro_model.yaml
      vague_examples:
        weight: 10
        target_fraction: 0.5   # scores 100 once >=50% of CUJs are vague/indirect
        model_config: datasets/model_configs/gemini_3.1_pro_model.yaml
      error_recovery:
        weight: 20
        target_fraction: 0.20  # scores 100 once >=20% of CUJs test error recovery
        model_config: datasets/model_configs/gemini_3.1_pro_model.yaml
      composition:
        weight: 20
        model_config: datasets/model_configs/gemini_3.1_pro_model.yaml

############################################################
### Reporting
############################################################
# The grade lands as one scoring row; uncomment bigquery to also append to the table.
reporting:
  csv:
    output_directory: 'results'
  # bigquery:
  #   gcp_project_id: your-gcp-project
