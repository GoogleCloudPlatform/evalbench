############################################################
### MCP Readability — sample run config
############################################################
# Drives the `mcp_readability` orchestrator: for each endpoint, fetch its tools
# (rendered as a man-page), score them against the style guide with an LLM, and
# emit one result row per endpoint to the shared EvalBench reporters.
#
# NOTE: this is a sample/illustrative config. The `mcp_tools` generator (this PR)
# already consumes `endpoints.yaml` and each entry's `tools_source`. The
# `mcp_readability` orchestrator and the LLM judge referenced below land in a
# follow-up PR.

orchestrator: mcp_readability

# Plug-and-play scorers. Each key names a registered mcp_readability scorer
# (SCORER_REGISTRY in the orchestrator) and carries that scorer's own config.
# The orchestrator runs every scorer declared here against each endpoint and
# merges their result columns; the shared analyzer aggregates a per-scorer pass
# rate (comparator = scorer name) for the scores / summary reports. Add a scorer
# (e.g. conformance) by registering the class and adding a block here.
scorers:
  # Deterministic size metrics. Pass = within token budget. `token_budget` feeds
  # mcp_readability_token_budget_used_percent (endpoints may override per-entry).
  mcp_tool_metrics:
    token_budget: 200000
  # LLM judge vs the style guide. Pass = no P0 findings. Owns its model config
  # and style-guide path. Run with EVAL_GCP_PROJECT_REGION=global.
  mcp_style_readability:
    model_config: datasets/model_configs/gemini_3.1_pro_model.yaml
    style_guide: datasets/mcp_readability/style_guide.md

# Carry-forward baselines (optional; omit the whole block to keep today's
# behaviour, which re-judges every endpoint on every run).
#
# The LLM judge is a thinking model: even at temperature 0 an unchanged tool
# surface can produce different findings, so issue counts drift with no
# explanation. With a baseline store configured, each endpoint's tool surface
# and judge inputs are fingerprinted; when nothing changed the previous findings
# are reused verbatim and the model is not called at all. Every deviation is
# reported in `mcp_readability_change_reason` (unchanged / tools_changed /
# style_guide_changed / model_changed / ...), so numbers move only for tools a
# team actually touched.
#
# Waiving a rule in `exceptions.yaml` changes the judge fingerprint and so
# re-judges that whole endpoint.
# baseline:
#   store: bigquery        # none (default) | local | bigquery
#   # store: local         # reads results/<job_id>/evals.csv from earlier runs;
#   #   results_dir: results   # must match reporting.csv.output_directory
#   max_age_days: 90       # re-derive a baseline older than this; 0 disables
#                          # expiry. Staggered per endpoint so they don't all
#                          # flip on the same day. Reported as baseline_expired.
#   force_refresh: false   # re-judge everything once (also
#                          # EVALBENCH_MCP_FORCE_REFRESH=1 for one-offs)
#   # force_refresh_products: ["AlloyDB"]   # or just these products

# Inputs (paths relative to the repo root / run cwd).
endpoints_config: datasets/mcp_readability/endpoints.yaml
exceptions_config: datasets/mcp_readability/exceptions.yaml          # optional
tools_generator_config: datasets/mcp_readability/tools_generator.yaml

# Optional filter: only check endpoints whose endpoint_type is in this list.
# Empty = check all. e.g. [PROD]
endpoint_types: []

# Per-endpoint check concurrency.
runners:
  endpoint_runners: 4

# Shared EvalBench reporters. CSV writes results/<job_id>/evals.csv; uncomment
# bigquery to also append rows to <gcp_project_id>.evalbench.results
# (schema auto-evolves).
reporting:
  csv:
    output_directory: 'results'
  # bigquery:
  #   gcp_project_id: your-gcp-project
