apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: evalbench-test-namespace
  name: evalbench-test-eval-server-deploy
  labels:
    app: evalbench-test-eval-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evalbench-test-eval-server
  template:
    metadata:
      labels:
        app: evalbench-test-eval-server
    spec:
      securityContext:
        fsGroup: 65532
      serviceAccountName: evalbench-test-ksa
      containers:
      - image: us-central1-docker.pkg.dev/cloud-db-nl2sql/evalbench/eval_server:test
        env:
        - name: EVAL_DB_PASSWORD
          value: pantheon
        - name: EVALBENCH_HEALTH_PORT
          value: "8080"
        - name: EVALBENCH_LOOP_STALL_SECONDS
          value: "300"
        - name: EVALBENCH_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: EVALBENCH_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: EVALBENCH_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        imagePullPolicy: Always
        name: evalbench-test-eval
        # go/gke-shipshape
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        ports:
        - protocol: TCP
          containerPort: 50051
        - protocol: TCP
          containerPort: 8080
          name: health
        # See evalbench.yaml for the reasoning behind these values.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 10
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /tmp_sessions
          name: tmp-sessions
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: tmp-sessions
        emptyDir: {}
