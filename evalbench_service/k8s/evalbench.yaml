apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: evalbench-namespace
  name: evalbench-eval-server-deploy
  labels:
    app: evalbench-eval-server
spec:
  replicas: 1
  # The pod mounts a ReadWriteOnce PVC (evalbench-ssd-pvc), so only one pod
  # can ever attach it. RollingUpdate starts the new pod before stopping the
  # old one, and the new pod then sits in ContainerCreating forever waiting for
  # the volume -- which left the Deployment `Available=False` for months, one
  # stuck pod per `kubectl rollout restart`. Recreate is the correct strategy
  # for an RWO-backed singleton; see also hpa.yaml, which is pinned to 1/1.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evalbench-eval-server
  template:
    metadata:
      labels:
        app: evalbench-eval-server
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      securityContext:
        fsGroup: 0
      serviceAccountName: evalbench-ksa
      containers:
      - image: us-central1-docker.pkg.dev/cloud-db-nl2sql/evalbench/eval_server:latest
        env:
        - name: EVAL_DB_PASSWORD
          value: pantheon
        - name: UV_CACHE_DIR
          value: /tmp/uv-cache
        - name: EVAL_GCP_PROJECT_ID
          value: cloud-db-nl2sql
        - name: GOOGLE_CLOUD_PROJECT
          value: cloud-db-nl2sql
        - name: EVAL_GCP_PROJECT_REGION
          value: us-central1
        # How many `Eval` RPCs this pod runs at once. Unset, Python's default
        # executor caps it at min(32, cpu+4) -- a hard ceiling that callers
        # driving one scenario per RPC (the continuous CI fan-out) hit long
        # before the pod runs out of CPU.
        #
        # Sized for containerized runs, where each thread only polls a
        # Kubernetes Job and is nearly idle. In-process runs execute a full
        # agent CLI per thread on this pod, so do not route large in-process
        # fan-outs here expecting this many to run well.
        - name: EVALBENCH_EVAL_THREADS
          value: "128"
        # Plain-HTTP kubelet probe endpoint (util/health.py); the gRPC port is
        # ALTS, which a `grpc:` probe cannot speak.
        - name: EVALBENCH_HEALTH_PORT
          value: "8080"
        # /healthz fails only after the gRPC event loop has not ticked for
        # this long: a wedged process, not a busy one.
        - name: EVALBENCH_LOOP_STALL_SECONDS
          value: "300"
        # This pod's identity, so every eval-case Job it creates (and, through
        # the Job, its ConfigMap) is owned by it and garbage-collected by
        # Kubernetes if the pod goes away mid-run (container/k8s_backend.py).
        # Ownership is skipped unless the namespace matches the Jobs'
        # namespace: ownerReferences cannot cross namespaces.
        - name: EVALBENCH_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: EVALBENCH_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: EVALBENCH_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        imagePullPolicy: Always
        name: evalbench-eval
        resources:
          requests:
            cpu: "20"
            memory: "80Gi"
          limits:
            cpu: "20"
            memory: "80Gi"
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        ports:
        - protocol: TCP
          containerPort: 50051
          name: grpc
        - protocol: TCP
          containerPort: 8000
          name: metrics
        - protocol: TCP
          containerPort: 3000
          name: ui
        - protocol: TCP
          containerPort: 8080
          name: health
        # Startup gets up to 10 minutes: image pull of a multi-GB image plus
        # proto generation and the gRPC bind. Liveness only takes over after.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          failureThreshold: 60
        # Ready only once the gRPC server is bound and started; 503 again as
        # soon as SIGTERM starts draining. Generous timeout: the endpoint has
        # its own thread, but it still shares the GIL with busy workers.
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
        # Fails only if the gRPC event loop has not ticked for
        # EVALBENCH_LOOP_STALL_SECONDS (util/health.py), i.e. the process is
        # wedged, not merely busy. A restart kills every in-flight eval and its
        # in-memory sessions (a load test lost 22/100 runs to one), so the
        # probe itself also tolerates ~5 minutes of timeouts.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 10
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /tmp_session_files
          name: gcs-fuse-csi-vol
        - mountPath: /tmp_sessions
          name: evalbench-ssd-vol
        - mountPath: /etc/evalbench-sa-key
          name: evalbench-sa-key-vol
          readOnly: true
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: gcs-fuse-csi-vol
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: evalbench-sessions-cloud-db-nl2sql
            mountOptions: "implicit-dirs,uid=0,gid=0"
      - name: evalbench-ssd-vol
        persistentVolumeClaim:
          claimName: evalbench-ssd-pvc
      - name: evalbench-sa-key-vol
        secret:
          secretName: evalbench-sa-key
          defaultMode: 0444
