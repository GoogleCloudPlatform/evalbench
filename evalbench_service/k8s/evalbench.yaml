apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: evalbench-namespace
  name: evalbench-eval-server-deploy
  labels:
    app: evalbench-eval-server
spec:
  # A singleton by construction: /tmp_sessions is a ReadWriteOnce PVC, so only
  # one pod can ever mount it. RollingUpdate would start the replacement
  # before stopping the old pod, and the new one would wait forever on the
  # volume attach -- every `kubectl rollout restart` stranded another pod.
  # Recreate stops the old pod first. See also hpa.yaml.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evalbench-eval-server
  template:
    metadata:
      labels:
        app: evalbench-eval-server
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      securityContext:
        fsGroup: 0
      serviceAccountName: evalbench-ksa
      containers:
      - image: us-central1-docker.pkg.dev/cloud-db-nl2sql/evalbench/eval_server:latest
        env:
        - name: EVAL_DB_PASSWORD
          value: pantheon
        - name: UV_CACHE_DIR
          value: /tmp/uv-cache
        - name: EVAL_GCP_PROJECT_ID
          value: cloud-db-nl2sql
        - name: GOOGLE_CLOUD_PROJECT
          value: cloud-db-nl2sql
        - name: EVAL_GCP_PROJECT_REGION
          value: us-central1
        # The pod's own identity, so work it starts in the cluster (such as
        # containerized eval-case Jobs) can name it as owner and be garbage
        # collected with it.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        imagePullPolicy: Always
        name: evalbench-eval
        resources:
          requests:
            cpu: "20"
            memory: "80Gi"
          limits:
            cpu: "20"
            memory: "80Gi"
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsUser: 0
          runAsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        ports:
        - protocol: TCP
          containerPort: 50051
          name: grpc
        - protocol: TCP
          containerPort: 8000
          name: health
        - protocol: TCP
          containerPort: 3000
          name: ui
        # Served by util/health.py. The gRPC port speaks ALTS, which kubelet
        # probes cannot, so it cannot back these.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 60
        # Restarts the pod only after ~3 minutes of a wedged event loop, not
        # on one slow beat: a restart kills every in-flight evaluation.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /tmp_session_files
          name: gcs-fuse-csi-vol
        - mountPath: /tmp_sessions
          name: evalbench-ssd-vol
        - mountPath: /etc/evalbench-sa-key
          name: evalbench-sa-key-vol
          readOnly: true
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: gcs-fuse-csi-vol
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: evalbench-sessions-cloud-db-nl2sql
            mountOptions: "implicit-dirs,uid=0,gid=0"
      - name: evalbench-ssd-vol
        persistentVolumeClaim:
          claimName: evalbench-ssd-pvc
      - name: evalbench-sa-key-vol
        secret:
          secretName: evalbench-sa-key
          defaultMode: 0444
