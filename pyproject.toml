[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-evalbench"
version = "1.22.0"
requires-python = ">=3.11"
description = "Evalbench - evaluation benchmarking framework"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cloud-sql-python-connector[pg8000]",
    "google-cloud-alloydb-connector[pg8000]",
    "cloud-sql-python-connector[pytds]",
    "sqlalchemy-pytds",
    "google-genai",
    "google-cloud-aiplatform",
    "google-cloud-secret-manager",
    "google-cloud-bigtable",
    "google-cloud-spanner",
    "google-cloud-dataform",
    "sqlalchemy-spanner",
    "pandas",
    "pandas-gbq",
    "pymysql",
    "sqlalchemy",
    "pyaml_env",
    "pyarrow",
    "protobuf",
    "absl-py",
    "tabulate",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "aiologger",
    "jsonschema",
    "ratelimit",
    "backoff",
    "GitPython",
    "sqlparse",
    "redis",
    "anthropic[vertex]",
    "sqlglot",
    "pymongo",
    "mongomock",
    "rich",
    "google-adk>=2.14.0",
    "google-cloud-geminidataanalytics>=0.11.0",
    "google-cloud-firestore",
    "google-cloud-iam",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "jupyter-server",
    "jupyter-client",
    "nbformat",
    "ipykernel",
    "tornado>=6.6.1",
    "dbt-core",
    "dbt-bigquery",
    "dbt-postgres",
    "a2a-sdk>=1.0.3",
    # 2.0.0 renamed mcp.client.streamable_http.streamablehttp_client to
    # streamable_http_client, breaking generators/models/mcp_tools.py. The
    # 1.8 floor is where streamablehttp_client was introduced. Lift once the
    # call site is migrated to the 2.x name.
    "mcp>=1.8,<2",
    # Releases before 2.55.2 use pyOpenSSL in the mTLS path
    # (urllib3.contrib.pyopenssl.inject_into_urllib3), and pyOpenSSL>=26.2
    # breaks that path. google-adk requires google-auth[pyopenssl], so an
    # older google-auth installs pyOpenSSL again. Do not lower this floor.
    "google-auth>=2.55.2",
    # Dispatches one Kubernetes Job per eval case when `containerization` is
    # enabled (evalbench/container/k8s_backend.py). Imported lazily, so other
    # runs never load it. Capped below 37, which moves to pydantic and drags in
    # a pydantic/pydantic-core upgrade for everything else.
    "kubernetes>=36.0.3,<37",
]

[tool.uv.sources]
viewer = { workspace = true }

[project.scripts]
google-evalbench = "evalbench.evalbench:run"

[tool.setuptools.packages.find]
include = ["evalbench*"]

[tool.setuptools.package-data]
evalbench = ["evalproto/*.proto", "evalproto/*.pyi"]

[tool.uv.workspace]
members = [
    "viewer",
]

[dependency-groups]
dev = [
    "pycodestyle>=2.14.0",
    "pytest>=8.0.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
markers = [
    "real_agy_install: exercise the real agy installer path (opts out of the autouse install stub)",
    "real_agy_probe: exercise the real agy startup probe (opts out of the autouse probe stub)",
]
